name: Windows Server 2022 RDP

on:
  workflow_dispatch: # Ativação manual

jobs:
  build:
    runs-on: windows-2022 # Windows Server 2022
    steps:
      - name: Instalando o Ngrok via Chocolatey
        run: |
          choco install ngrok --no-progress -y
          
      - name: Autenticando o Ngrok
        run: |
          ngrok config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
          
      - name: Ativando o Acesso RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          
      - name: Criando o Túnel e Exibindo Dados de Conexão
        run: |
          Write-Host "Iniciando o túnel Ngrok..."
          
          # Passamos a região 'us' direto no comando do túnel
          $NgrokProcess = Start-Process ngrok -ArgumentList "tcp 3389 --region us" -PassThru
          
          # Aguarda 15 segundos para o túnel estabelecer
          Start-Sleep -Seconds 15
          
          # Pega o endereço público gerado
          try {
              $tunnels = Invoke-RestMethod -Uri "http://localhost:4040/api/tunnels" -TimeoutSec 10
              $public_url = $tunnels.tunnels.public_url
              
              if ($public_url) {
                  Write-Host "===================================================="
                  Write-Host "CONECTE NO SEU RDP USANDO O ENDEREÇO ABAIXO:"
                  Write-Host $public_url
                  Write-Host "===================================================="
              } else {
                  Write-Host "Erro: API respondeu, mas sem URL pública."
              }
          } catch {
              Write-Host "===================================================="
              Write-Host "ERRO CRÍTICO: O Ngrok não iniciou corretamente."
              Write-Host "Verificando se o processo do Ngrok ainda está vivo..."
              if ($NgrokProcess.HasExited) {
                  Write-Host "O processo do Ngrok FECHOU sozinho! Código de saída: $($NgrokProcess.ExitCode)"
              } else {
                  Write-Host "O processo está aberto, mas a API travou."
              }
              Write-Host "===================================================="
              exit 1
          }
          
      - name: Manter o RDP Vivo (6 Horas)
        run: |
          $val = 21600
          while ($val -gt 0) {
            Write-Host "Tempo restante de máquina ativa: $val segundos"
            Start-Sleep -Seconds 60
            $val -= 60
          }
