name: Windows Server 2022 RDP

on:
  workflow_dispatch: # Ativação manual

jobs:
  build:
    runs-on: windows-2022 # Windows Server 2022
    steps:
      - name: Instalando o Ngrok via Chocolatey
        run: |
          choco install ngrok --no-progress -y
          
      - name: Autenticando o Ngrok
        run: |
          ngrok config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
          
      - name: Ativando o Acesso RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          
      - name: Criando o Túnel e Exibindo Dados de Conexão
        run: |
          # Inicia o túnel na porta do RDP (3389)
          Start-Process ngrok -ArgumentList "tcp 3389 --log=stdout"
          
          # Aguarda 20 segundos para o Chocolatey e o Ngrok iniciarem totalmente
          Write-Host "Aguardando o Ngrok iniciar..."
          Start-Sleep -Seconds 20
          
          # Tenta obter a URL oficial gerada
          try {
              $tunnels = Invoke-RestMethod -Uri "http://localhost:4040/api/tunnels" -TimeoutSec 10
              $public_url = $tunnels.tunnels.public_url
              
              if ($public_url) {
                  Write-Host "===================================================="
                  Write-Host "CONECTE NO SEU RDP USANDO O ENDEREÇO ABAIXO:"
                  Write-Host $public_url
                  Write-Host "===================================================="
              } else {
                  Write-Host "Erro: O túnel foi criado, mas a URL não foi encontrada."
              }
          } catch {
              Write-Host "Erro ao conectar na API local do Ngrok. Tentando novamente em 10 segundos..."
              Start-Sleep -Seconds 10
              $tunnels = Invoke-RestMethod -Uri "http://localhost:4040/api/tunnels"
              $public_url = $tunnels.tunnels.public_url
              Write-Host "===================================================="
              Write-Host "CONECTE NO SEU RDP USANDO O ENDEREÇO ABAIXO:"
              Write-Host $public_url
              Write-Host "===================================================="
          }
          
      - name: Manter o RDP Vivo (6 Horas)
        run: |
          $val = 21600
          while ($val -gt 0) {
            Write-Host "Tempo restante de máquina ativa: $val segundos"
            Start-Sleep -Seconds 60
            $val -= 60
          }
