name: Windows Server 2022 RDP

on:
  workflow_dispatch: # Ativação manual

jobs:
  build:
    runs-on: windows-2022 # Windows Server 2022
    steps:
      - name: Baixando e Configurando o Ngrok (Link Oficial)
        run: |
          # Baixa o zip oficial estável do site do Ngrok
          Invoke-WebRequest -Uri "https://bin.equinox.io/c/bNy7823bHhQ/ngrok-v3-stable-windows-amd64.zip" -OutFile "ngrok.zip"
          
          # Descompacta o conteúdo na pasta atual
          Expand-Archive -Path "ngrok.zip" -DestinationPath "."
          
      - name: Autenticando o Ngrok
        run: |
          # Executa o ngrok que foi descompactado na raiz
          .\ngrok.exe config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
          
      - name: Ativando o Acesso RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          
      - name: Criando o Túnel e Exibindo Dados de Conexão
        run: |
          # Inicia o túnel na porta do RDP (3389)
          Start-Process .\ngrok.exe -ArgumentList "tcp 3389"
          Start-Sleep -Seconds 12
          
          # Pega o endereço público gerado pelo Ngrok via API local
          $tunnels = Invoke-RestMethod -Uri http://localhost:4040/api/tunnels
          $public_url = $tunnels.tunnels.public_url
          
          Write-Host "===================================================="
          Write-Host "CONECTE NO SEU RDP USANDO O ENDEREÇO ABAIXO:"
          Write-Host $public_url
          Write-Host "===================================================="
          
      - name: Manter o RDP Vivo (6 Horas)
        run: |
          $val = 21600
          while ($val -gt 0) {
            Write-Host "Tempo restante de máquina ativa: $val segundos"
            Start-Sleep -Seconds 60
            $val -= 60
          }
