name: AWS

on:
  workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 9999

    steps:
    - name: Download ngrok
      run: |
        Invoke-WebRequest https://equinox.io -OutFile ngrok.zip

    - name: Extract ngrok
      run: |
        Expand-Archive ngrok.zip -DestinationPath ngrok

    - name: Configure ngrok
      run: |
        .\ngrok\ngrok.exe config add-authtoken $Env:NGROK_AUTH_TOKEN
      env:
        NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}

    - name: Enable RDP
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1

    - name: Set Password
      run: |
        net user runneradmin P@ssw0rd!

    - name: Start ngrok Tunnel
      run: |
        # Força o ngrok a usar a região da Europa (eu) para evitar o IP bloqueado dos EUA
        Start-Process .\ngrok\ngrok.exe -ArgumentList "tcp 3389 --region eu"
        Write-Host "Aguardando 15 segundos para o túnel estabilizar na nova região..."
        Start-Sleep -Seconds 15
        
        # Loop infinito para manter o GitHub Actions ativo
        while ($true) {
            Start-Sleep -Seconds 60
        }
