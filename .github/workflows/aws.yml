name: AWS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Install ngrok
      run: |
        Invoke-WebRequest -Uri "https://equinox.io" -OutFile "ngrok.zip"
        Expand-Archive -Path "ngrok.zip" -DestinationPath "C:\Windows\System32" -Force
        Remove-Item "ngrok.zip"

    - name: Configure ngrok
      run: |
        ngrok config add-authtoken $Env:NGROK_AUTH_TOKEN
      env:
        NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}

    - name: Enable RDP
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1

    - name: Set Password
      run: |
        net user runneradmin P@ssw0rd!

    - name: Start ngrok Tunnel
      run: |
        Start-Process ngrok -ArgumentList "tcp 3389 --region eu --log=ngrok_output.log" -NoNewWindow
        
        Write-Host "Aguardando o túnel inicializar na região da Europa..."
        Start-Sleep -Seconds 15
        
        $LogContent = Get-Content ngrok_output.log
        $UrlLine = $LogContent | Select-String -Pattern "url=tcp://"
        
        if ($UrlLine) {
            Write-Host "=========================================================="
            Write-Host "CONEXÃO RDP ENCONTRADA:"
            Write-Host $UrlLine
            Write-Host "=========================================================="
        } else {
            Write-Host "Aviso: Não foi possível filtrar a linha da URL. Mostrando o log:"
            $LogContent
        }
        
        while ($true) {
            Start-Sleep -Seconds 60
        }
