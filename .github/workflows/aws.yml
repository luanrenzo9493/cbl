name: AWS

on:
  workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 9999

    steps:
    - name: Download ngrok
      run: |
        Invoke-WebRequest https://equinox.io -OutFile ngrok.zip

    - name: Extract ngrok
      run: |
        7z x ngrok.zip -ongrok

    - name: Configure ngrok
      run: |
        .\ngrok\ngrok.exe config add-authtoken $Env:NGROK_AUTH_TOKEN
      env:
        NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}

    - name: Enable RDP
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1

    - name: Set Password
      run: |
        net user runneradmin P@ssw0rd!

    - name: Start ngrok Tunnel
      run: |
        # Inicia o ngrok gerando um arquivo de log local na máquina virtual
        Start-Process .\ngrok\ngrok.exe -ArgumentList "tcp 3389 --region eu --log=stdout" -RedirectStandardOutput "ngrok_output.log"
        
        Write-Host "Aguardando o túnel inicializar..."
        Start-Sleep -Seconds 10
        
        # Lê o arquivo de log e filtra para mostrar a URL de conexão direto na tela do GitHub
        $LogContent = Get-Content ngrok_output.log
        $UrlLine = $LogContent | Select-String -Pattern "url=tcp://"
        
        if ($UrlLine) {
            Write-Host "=========================================================="
            Write-Host "CONEXÃO RDP ENCONTRADA:"
            Write-Host $UrlLine
            Write-Host "=========================================================="
        } else {
            Write-Host "Log do ngrok para verificação:"
            $LogContent | Select-Object -First 30
        }
        
        # Loop infinito para manter a máquina ligada
        while ($true) {
            Start-Sleep -Seconds 60
        }
