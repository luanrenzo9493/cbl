name: AWS

on:
  workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 9999

    steps:
    - name: Install ngrok via Chocolatey
      run: |
        choco install ngrok -y

    - name: Configure ngrok
      run: |
        ngrok config add-authtoken $Env:NGROK_AUTH_TOKEN
      env:
        NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}

    - name: Enable RDP
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1

    - name: Set Password
      run: |
        net user runneradmin P@ssw0rd!

    - name: Start ngrok Tunnel
      run: |
        # Inicia o ngrok gerando um arquivo de log local para extrairmos a URL
        Start-Process ngrok -ArgumentList "tcp 3389 --region eu --log=stdout" -RedirectStandardOutput "ngrok_output.log"
        
        Write-Host "Aguardando o túnel inicializar na região da Europa..."
        Start-Sleep -Seconds 15
        
        # Lê o log e filtra para mostrar a URL de conexão direto na tela do GitHub
        $LogContent = Get-Content ngrok_output.log
        $UrlLine = $LogContent | Select-String -Pattern "url=tcp://"
        
        if ($UrlLine) {
            Write-Host "=========================================================="
            Write-Host "CONEXÃO RDP ENCONTRADA:"
            Write-Host $UrlLine
            Write-Host "=========================================================="
        } else {
            Write-Host "Aviso: Não foi possível filtrar a linha da URL. Mostrando as primeiras linhas do log:"
            $LogContent | Select-Object -First 30
        }
        
        # Loop infinito para manter a máquina ativa
        while ($true) {
            Start-Sleep -Seconds 60
        }
