name: Debian 11 RDP (Ngrok)

on:
  workflow_dispatch:

jobs:
  start-desktop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Criar compose.yml e subir container
        run: |
          cat << 'EOF' > compose.yml
          services:
            debian11-rdp:
              image: scottyhardy/docker-remote-desktop:latest
              container_name: debian11
              environment:
                - PUID=1000
                - PGID=1000
                - TZ=America/Recife
                - USER=admin
                - PASSWORD=admin
              ports:
                - "3389:3389"
              shm_size: "2gb"
          EOF
          docker compose up -d

      - name: Instalar e iniciar Ngrok TCP 3389
        env:
          NGROK_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          curl -sSL https://amazonaws.com | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt-get update && sudo apt-get install -y ngrok
          ngrok config add-authtoken "$NGROK_TOKEN"
          nohup ngrok tcp 3389 --log=stdout > ngrok.log 2>&1 &
          sleep 10
          grep -o 'tcp://[^ ]*' ngrok.log || cat ngrok.log

      - name: Manter sessão ativa para testes
        run: sleep 21000
