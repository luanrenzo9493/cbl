name: Debian 11 Docker Compose

on:
  workflow_dispatch:

jobs:
  start-desktop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Criar compose.yml e subir container
        run: |
          cat << 'EOF' > compose.yml
          services:
            debian-rdp:
              image: linuxserver/webtop:debian-xfce
              container_name: debian11
              environment:
                - PUID=1000
                - PGID=1000
                - TZ=America/Recife
                - CUSTOM_USER=admin
                - PASSWORD=admin
              ports:
                - "3000:3000"
              shm_size: "2gb"
          EOF
          docker compose up -d

      - name: Instalar e iniciar Cloudflare Tunnel
        run: |
          curl -L --output cloudflared.deb https://github.com
          sudo dpkg -i cloudflared.deb
          nohup cloudflared tunnel --url http://localhost:3000 > tunnel.log 2>&1 &
          sleep 15
          cat tunnel.log
          grep -o 'https://[-0-9a-z]*\.trycloudflare\.com' tunnel.log || true

      - name: Manter sessão ativa para testes
        run: sleep 3600
