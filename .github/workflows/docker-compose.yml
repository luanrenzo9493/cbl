name: Debian 11 RDP (Ngrok)

on:
  workflow_dispatch:

jobs:
  start-desktop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Criar compose.yml e subir container
        run: |
          cat << 'EOF' > compose.yml
          services:
            debian11-rdp:
              image: scottyhardy/docker-remote-desktop:latest
              container_name: debian11
              privileged: true
              volumes:
                - /var/run/docker.sock:/var/run/docker.sock
              environment:
                - PUID=1000
                - PGID=1000
                - TZ=America/Recife
              ports:
                - "3389:3389"
              shm_size: "2gb"
          EOF
          docker compose up -d
          sleep 5
          docker exec debian11 bash -c "apt-get update && apt-get install -y docker.io docker-compose-v2 xarchiver unzip unrar p7zip-full && echo 'root:admin' | chpasswd && echo 'startxfce4' > /root/.xsession && useradd -m -s /bin/bash -G sudo admin && echo 'admin:admin' | chpasswd && echo 'admin ALL=(ALL) NOPASSWD:ALL' >> /etc/sudoers && echo 'startxfce4' > /home/admin/.xsession && chown admin:admin /home/admin/.xsession"

      - name: Instalar e iniciar Ngrok TCP 3389
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          sudo snap install ngrok
          nohup ngrok tcp 3389 --log=stdout > /tmp/ngrok.log 2>&1 &
          sleep 10
          grep -o 'tcp://[^ ]*' /tmp/ngrok.log || cat /tmp/ngrok.log

      - name: Manter sessão ativa para testes
        run: sleep 21000
